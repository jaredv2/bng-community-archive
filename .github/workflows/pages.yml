name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repository secrets, not committed values. Set these under
      # Settings > Secrets and variables > Actions.
      ARCHIVE_API_URL: ${{ secrets.ARCHIVE_API_URL }}
      ARCHIVE_API_KEY: ${{ secrets.ARCHIVE_API_KEY }}
      ARCHIVE_SITE_NAME: ${{ vars.ARCHIVE_SITE_NAME || 'Community Archive' }}
      ARCHIVE_NAME: ${{ vars.ARCHIVE_NAME || 'BNG' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Messages · Community Archive</title>
<meta name="description" content="A wall of messages from everyone in the community." />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#080808" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="../assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="../assets/css/global.css?v=fd1624a" />
<link rel="modulepreload" href="../assets/js/app.js?v=fd1624a" />
<script type="module" src="../assets/js/app.js?v=fd1624a"></script>
</head>
<body data-page="messages" data-title="Messages">
<a class="skip" href="#main">Skip to content</a>
<main id="main" tabindex="-1">
<div class="narrow">
  <header class="page-heading center reveal">
    <span class="eyebrow">The community wall</span>
    <h1>Leave a message</h1>
    <p>A hello, an inside joke, or something to remember.</p>
  </header>

  <form id="message-form" class="form-card stack reveal" style="--delay: 70ms" novalidate>
    <label for="message-name">Name
      <input id="message-name" name="name" required maxlength="60" autocomplete="nickname" placeholder="Your name" />
    </label>
    <label for="message-content">Message
      <textarea id="message-content" name="content" required maxlength="2000" rows="5" placeholder="Leave a few words…"></textarea>
    </label>
    <button class="primary" type="submit">Post message <span aria-hidden="true">↗</span></button>
  </form>

  <section aria-label="Public messages">
    <div class="section-heading">
      <h2>From the community</h2>
      <span class="eyebrow">Open to everyone</span>
    </div>
    <div id="messages" class="message-list">
      <div class="empty empty-compact empty-loading" role="status">Loading messages…</div>
    </div>
    <div class="load-more-wrap">
      <button id="messages-more" class="button load-more" hidden>Load more messages</button>
    </div>
  </section>
</div>
</main>
<noscript><p class="noscript">This archive needs JavaScript to load posts and send submissions.</p></noscript>
</body>
</html>

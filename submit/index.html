<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Photos, clips and memories from our community."><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#080808"><title>Submit · Community Archive</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/css/global.css"><script type="module" src="../assets/js/app.js"></script></head><body data-page="submit" data-title="Submit"><a class="skip" href="#main">Skip to content</a><main id="main"><div class="narrow"><header class="page-heading"><span class="eyebrow">Add to the collection</span><h1>Got a memory?</h1><p>Share a photo, GIF or clip. Every submission is reviewed before it joins the archive.</p></header><form id="submit-form" class="form-card stack"><label>Your name<input name="username" required maxlength="60" placeholder="What should we call you?" autocomplete="nickname"></label><label>Caption<textarea name="caption" required maxlength="1000" rows="3" placeholder="A little context for this moment…"></textarea></label><div id="dropzone" class="dropzone"><span class="upload-symbol" aria-hidden="true">↥</span><strong>Drop your memory here</strong><label class="button" for="file">Choose file<input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,.gif,.mp4,.webm"></label><p class="hint">JPG, PNG, WebP, GIF · up to 20 MB<br>MP4, WebM · up to 50 MB</p></div><div id="preview"></div><progress id="upload-progress" max="100" value="0" hidden aria-label="Upload progress"></progress><div id="upload-label" role="status"></div><button id="submit-button" class="primary">Send for approval ↗</button><p class="hint">Only share media you have permission to share.</p></form></div></main><noscript><p>This archive needs JavaScript to load posts and send submissions.</p></noscript></body></html>

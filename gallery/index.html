<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Gallery · Community Archive</title>
<meta name="description" content="Every photo, GIF and clip the community has shared." />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#080808" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="../assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="../assets/css/global.css?v=fd1624a" />
<link rel="modulepreload" href="../assets/js/app.js?v=fd1624a" />
<script type="module" src="../assets/js/app.js?v=fd1624a"></script>
</head>
<body data-page="gallery" data-title="Gallery">
<a class="skip" href="#main">Skip to content</a>
<main id="main" tabindex="-1">
<header class="page-heading reveal">
  <span class="eyebrow">The shared camera roll</span>
  <h1>The gallery.</h1>
  <p>Our moments, big and small. Pinned memories come first, then everything else, newest at the top.</p>
</header>

<div class="toolbar reveal" style="--delay: 70ms">
  <div class="filters" role="group" aria-label="Filter by media type">
    <button class="chip" data-filter="all" aria-pressed="true">All</button>
    <button class="chip" data-filter="image" aria-pressed="false">Photos</button>
    <button class="chip" data-filter="gif" aria-pressed="false">GIFs</button>
    <button class="chip" data-filter="video" aria-pressed="false">Clips</button>
  </div>
  <a class="button subtle" data-href="search/">
    <span aria-hidden="true">⌕</span> Search the archive
  </a>
</div>

<section aria-label="Gallery posts">
  <div id="posts" class="grid" data-masonry>
    <div class="empty empty-compact empty-loading" role="status">Loading gallery…</div>
  </div>
  <p id="gallery-count" class="result-count" role="status" aria-live="polite"></p>
  <div class="sentinel" id="sentinel" aria-hidden="true"></div>
  <div class="load-more-wrap">
    <button id="gallery-more" class="button load-more" hidden>Load more</button>
  </div>
</section>
</main>
<noscript><p class="noscript">This archive needs JavaScript to load posts and send submissions.</p></noscript>
</body>
</html>

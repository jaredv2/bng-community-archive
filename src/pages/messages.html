<div class="narrow">
  <header class="page-heading center reveal">
    <span class="eyebrow">The community wall</span>
    <h1>Leave a message</h1>
    <p>A hello, an inside joke, or something to remember.</p>
  </header>

  <form id="message-form" class="form-card stack reveal" style="--delay: 70ms" novalidate>
    <label for="message-name">Name
      <input id="message-name" name="name" required maxlength="60" autocomplete="nickname" placeholder="Your name" />
    </label>
    <label for="message-content">Message
      <textarea id="message-content" name="content" required maxlength="2000" rows="5" placeholder="Leave a few words…"></textarea>
    </label>
    <button class="primary" type="submit">Post message <span aria-hidden="true">↗</span></button>
  </form>

  <section aria-label="Public messages">
    <div class="section-heading">
      <h2>From the community</h2>
      <span class="eyebrow">Open to everyone</span>
    </div>
    <div id="messages" class="message-list">
      <div class="empty empty-compact empty-loading" role="status">Loading messages…</div>
    </div>
    <div class="load-more-wrap">
      <button id="messages-more" class="button load-more" hidden>Load more messages</button>
    </div>
  </section>
</div>

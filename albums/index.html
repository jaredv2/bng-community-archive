<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Albums · Community Archive</title>
<meta name="description" content="Collections of memories, grouped by the community." />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#080808" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="../assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="../assets/css/global.css" />
<link rel="modulepreload" href="../assets/js/app.js" />
<script type="module" src="../assets/js/app.js"></script>
</head>
<body data-page="albums" data-title="Albums">
<a class="skip" href="#main">Skip to content</a>
<main id="main" tabindex="-1">
<header class="page-heading reveal">
  <span class="eyebrow">Collected by everyone</span>
  <h1>Albums.</h1>
  <p>Group the archive by mood, event or whatever thread you are pulling on.</p>
</header>

<div class="toolbar reveal" style="--delay: 70ms">
  <div class="filters" role="group" aria-label="Sort albums">
    <button class="chip" data-sort="recent" aria-pressed="true">Newest</button>
    <button class="chip" data-sort="size" aria-pressed="false">Largest</button>
    <button class="chip" data-sort="name" aria-pressed="false">A to Z</button>
  </div>
  <button id="new-album" class="primary">New album <span aria-hidden="true">+</span></button>
</div>

<section aria-label="Albums">
  <div id="albums" class="grid album-grid">
    <div class="empty empty-compact empty-loading" role="status">Loading albums…</div>
  </div>
</section>
</main>
<noscript><p class="noscript">This archive needs JavaScript to load posts and send submissions.</p></noscript>
</body>
</html>

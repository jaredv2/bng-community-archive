<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Admin Access · Community Archive</title>
<meta name="description" content="Moderation." />
<meta name="robots" content="noindex,nofollow" /><meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#080808" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="../assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="../assets/css/global.css?v=fd1624a" />
<link rel="modulepreload" href="../assets/js/app.js?v=fd1624a" />
<script type="module" src="../assets/js/app.js?v=fd1624a"></script>
</head>
<body data-page="adminpanel" data-title="Admin Access">
<a class="skip" href="#main">Skip to content</a>
<main id="main" tabindex="-1">
<div class="narrow">
  <header class="page-heading reveal">
    <span class="eyebrow">Community Archive</span>
    <h1>Admin access</h1>
  </header>

  <form id="admin-login" class="form-card stack reveal" style="--delay: 70ms" novalidate>
    <p id="admin-status" class="muted" role="status">Sign in to review submissions.</p>
    <label for="admin-email">Email
      <input id="admin-email" type="email" name="email" required autocomplete="username" />
    </label>
    <label for="admin-password">Password
      <input id="admin-password" type="password" name="password" required autocomplete="current-password" />
    </label>
    <button class="primary" type="submit">Unlock</button>
  </form>

  <section id="dashboard" hidden>
    <div class="section-heading">
      <h2>Review the archive</h2>
      <button id="logout" class="subtle">Logout</button>
    </div>

    <div class="tabs" role="tablist" aria-label="Admin sections">
      <button id="tab-queue" role="tab" data-tab="queue" aria-selected="true">Memories</button>
      <button id="tab-albums" role="tab" data-tab="albums" aria-selected="false">Albums</button>
      <button id="tab-reports" role="tab" data-tab="reports" aria-selected="false">Reports</button>
    </div>

    <div id="panel-queue" role="tabpanel" aria-labelledby="tab-queue">
      <p class="hint panel-note">Everything posts straight to the archive. Remove anything that should not be there.</p>
      <div id="admin-posts" class="grid admin-grid"></div>
      <div class="load-more-wrap">
        <button id="admin-more" class="button load-more" hidden>Load more</button>
      </div>
    </div>

    <div id="panel-albums" role="tabpanel" aria-labelledby="tab-albums" hidden>
      <div id="admin-albums" class="album-list"></div>
    </div>

    <div id="panel-reports" role="tabpanel" aria-labelledby="tab-reports" hidden>
      <div id="admin-reports" class="report-list"></div>
    </div>
  </section>
</div>
</main>
<noscript><p class="noscript">This archive needs JavaScript to load posts and send submissions.</p></noscript>
</body>
</html>
